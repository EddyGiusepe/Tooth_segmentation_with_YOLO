[project]
name = "project-segmentation"
version = "0.1.0"
description = "Here, I will segment the teeth using the YOLO model"
readme = "README.md"
authors = [
    { name = "EddyGiusepe", email = "eddychirinos.unac@gmail.com" }
]
requires-python = ">=3.13.7, <3.14"
dependencies = [
    "fastapi==0.142.2",
    "ipykernel==7.4.0",
    "ipywidgets==8.1.9",
    "kagglehub==1.0.2",
    "matplotlib==3.11.2",
    "nbformat==5.11.1",
    "pillow==12.3.0",
    "python-dotenv==1.2.4",
    "python-multipart==0.0.32",
    "torch==2.14.0",
    "tqdm==4.70.1",
    "ultralytics==8.4.166",
    "uvicorn==0.54.0",
    "wandb==0.30.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.9",
]

[tool.ruff]
extend = "ruff.toml"
